# Nginx reverse proxy config untuk raflyano.online -> WA Gateway (Node.js di 127.0.0.1:5000)
#
# Cara pakai di VPS:
#   sudo cp deploy/nginx-raflyano.online.conf /etc/nginx/sites-available/raflyano.online
#   sudo ln -s /etc/nginx/sites-available/raflyano.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d raflyano.online -d www.raflyano.online
#
# Setelah certbot jalan, dia akan otomatis menambahkan blok server 443 (SSL)
# dan mengubah blok di bawah ini jadi redirect ke https. Jangan dihapus manual.

server {
    listen 80;
    listen [::]:80;
    server_name raflyano.online www.raflyano.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Wajib untuk endpoint yang butuh WebSocket/long-lived connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
